name: Model request proof

# Runs Refit's `scripts/model-request-proof.mjs` at a pinned Refit commit: for each replacement model
# in data/model-request-proofs.json, the smallest request each API accepts, a JSON-output request, a
# forced tool call and a stream, sent with Refit's own keys from repository secrets, never a
# customer's. A provider whose secret is missing stays pending with that reason. It never writes to
# Refit: a person copies the uploaded model-request-proofs.json into Refit's data/.
# Logs and artifacts of this public repository are public; the script prints only model names,
# HTTP statuses and check names, and secrets go only through repository secrets.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Refit commit SHA to run
        required: true
      providers:
        description: Space-separated providers to prove (openai anthropic gemini; blank = all)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check inputs
        env:
          COMMIT: ${{ inputs.commit }}
          PROVIDERS: ${{ inputs.providers }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::commit must be a full 40-character SHA"; exit 1; fi
          if ! [[ "$PROVIDERS" =~ ^((openai|anthropic|gemini)( |$))*$ ]]; then echo "::error::providers must be openai, anthropic or gemini"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send the proof requests
        working-directory: refit
        env:
          PROVIDERS: ${{ inputs.providers }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=(--run "$RUN_URL" --output "$RUNNER_TEMP/model-request-proofs.json")
          for provider in $PROVIDERS; do args+=(--provider "$provider"); done
          node scripts/model-request-proof.mjs "${args[@]}" | tee "$RUNNER_TEMP/summary.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo '## Model request proof'
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo 'No summary.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-request-proofs
          path: ${{ runner.temp }}/model-request-proofs.json
          if-no-files-found: warn
