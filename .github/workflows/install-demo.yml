name: Install-time vendor demo

# Replays a real installation delivery of the Refit GitHub App into `refit hosted serve` and shows
# the vendors its inventories detect, their labels and the watch targets (docs/INVENTORY.md in Refit).
# The delivery is read through the App deliveries API with the App JWT and re-signed with a webhook
# secret this job generates; the App's settings are never changed. Inventories only read the
# repositories: nothing is enrolled, approved, edited or opened on them.
# Logs and artifacts of this public repository are public: private repositories are counted but
# never named, the delivery file and the worker's log stay on the runner, and the App secrets are
# written to files without being printed.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Refit commit SHA to run
        required: true
      owner:
        description: Account whose installation delivery to replay (blank = the newest of any account)
        required: false
        default: ''
      delivery:
        description: A delivery id to replay instead of the newest installation delivery
        required: false
        default: ''

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # Source: docker buildx imagetools inspect postgres:17-alpine, 2026-10-22
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: refit
          POSTGRES_PASSWORD: refit-demo-only
          POSTGRES_DB: refit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_VERSION: 17
      REFIT_DATABASE_URL: postgres://refit:refit-demo-only@127.0.0.1:5432/refit
      SERVICE: http://127.0.0.1:8787
    steps:
      - name: Check inputs
        env:
          COMMIT: ${{ inputs.commit }}
          OWNER: ${{ inputs.owner }}
          DELIVERY: ${{ inputs.delivery }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::commit must be a full 40-character SHA"; exit 1; fi
          if [ -n "$OWNER" ] && ! [[ "$OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then echo "::error::owner must be a GitHub login"; exit 1; fi
          if [ -n "$DELIVERY" ] && ! [[ "$DELIVERY" =~ ^[0-9]+$ ]]; then echo "::error::delivery must be a number"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refit/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      - name: Write the App key and this run's secrets
        env:
          APP_PRIVATE_KEY: ${{ secrets.REFIT_APP_PRIVATE_KEY }}
          APP_ID: ${{ secrets.REFIT_APP_ID }}
        run: |
          if [ -z "$APP_PRIVATE_KEY" ] || [ -z "$APP_ID" ]; then echo "::error::REFIT_APP_ID and REFIT_APP_PRIVATE_KEY must be set"; exit 1; fi
          umask 077
          mkdir -p "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/state" "$RUNNER_TEMP/out"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/secrets/app.pem"
          printf '%s' "$APP_ID" > "$RUNNER_TEMP/secrets/app-id"
          # A webhook secret and a service token made for this run only.
          webhook=$(openssl rand -hex 32); token=$(openssl rand -hex 32)
          echo "::add-mask::$webhook"; echo "::add-mask::$token"
          printf '%s' "$webhook" > "$RUNNER_TEMP/secrets/webhook"
          printf '%s' "$token" > "$RUNNER_TEMP/secrets/token"
      - name: Fetch the installation delivery
        id: delivery
        working-directory: refit
        env:
          OWNER: ${{ inputs.owner }}
          DELIVERY: ${{ inputs.delivery }}
        run: |
          export GITHUB_APP_ID=$(cat "$RUNNER_TEMP/secrets/app-id") GITHUB_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/secrets/app.pem"
          args=(fetch --delivery-file "$RUNNER_TEMP/secrets/delivery.json")
          if [ -n "$OWNER" ]; then args+=(--owner "$OWNER"); fi
          if [ -n "$DELIVERY" ]; then args+=(--delivery "$DELIVERY"); fi
          node scripts/install-demo.mjs "${args[@]}"
      - name: Start refit hosted serve
        working-directory: refit
        env:
          ACCOUNT: ${{ steps.delivery.outputs.account }}
        run: |
          export GITHUB_APP_ID=$(cat "$RUNNER_TEMP/secrets/app-id") GITHUB_APP_PRIVATE_KEY_FILE="$RUNNER_TEMP/secrets/app.pem"
          export REFIT_WEBHOOK_SECRET=$(cat "$RUNNER_TEMP/secrets/webhook") REFIT_SERVICE_TOKEN=$(cat "$RUNNER_TEMP/secrets/token")
          export REFIT_HOSTED_ACCOUNTS="$ACCOUNT" REFIT_HOSTED_WATCH=1
          # The worker log names repositories, private ones included, so it stays on the runner.
          nohup node bin/refit.mjs hosted serve --state "$RUNNER_TEMP/state" --interval 30 > "$RUNNER_TEMP/secrets/serve.log" 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS "$SERVICE/health" > /dev/null 2>&1; then echo "serve is up"; exit 0; fi
            sleep 2
          done
          echo "::error::serve did not answer /health within 120 seconds ($(wc -l < "$RUNNER_TEMP/secrets/serve.log") log lines kept on the runner)"
          exit 1
      - name: Replay the delivery and wait for inventories and watch captures
        working-directory: refit
        run: |
          export REFIT_WEBHOOK_SECRET=$(cat "$RUNNER_TEMP/secrets/webhook") REFIT_SERVICE_TOKEN=$(cat "$RUNNER_TEMP/secrets/token")
          node scripts/install-demo.mjs replay --delivery-file "$RUNNER_TEMP/secrets/delivery.json" \
            --service "$SERVICE" --output "$RUNNER_TEMP/out/demo.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Worker log lines that name no repository
        if: failure()
        working-directory: refit
        run: |
          # Only lines naming none of the delivery's repositories, so no private name is printed.
          node -e '
            const fs = require("fs");
            const delivery = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const names = (delivery.payload.repositories ?? delivery.payload.repositories_added ?? [])
              .flatMap((r) => [r.full_name.toLowerCase(), r.name.toLowerCase()]);
            const lines = fs.readFileSync(process.argv[2], "utf8").split("\n");
            for (const line of lines.slice(-200))
              if (!names.some((name) => line.toLowerCase().includes(name))) console.log(line);
          ' "$RUNNER_TEMP/secrets/delivery.json" "$RUNNER_TEMP/secrets/serve.log" || true
      - name: Stop serve and remove secrets
        if: always()
        run: |
          pkill -f "hosted serve" || true
          rm -rf "$RUNNER_TEMP/secrets"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-demo
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
