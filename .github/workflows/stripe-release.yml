name: Stripe release PR

# Watches stripe/openapi for a release tag newer than the one Refit's SDK map was generated from
# (pipeline/stripe-sdk-metadata.json `source`). For a newer tag it runs Refit's
# scripts/stripe-release-pr.mjs, uploads the generated branch as an artifact and opens a PR to
# pierceluu10/Refit from release/stripe-<tag>. A person reviews and merges it; nothing here merges.
# Logs and artifacts of this public repository are public; secrets go only through repository secrets.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: stripe/openapi tag such as v2591 (blank = the latest release, only if newer than Refit's)
        required: false
        default: ''
      ref:
        description: Refit branch or full commit SHA to run
        required: true
        default: main
      ai_budget:
        description: AI cap in USD for classifying a new API version (0 = no AI, at most 1)
        required: true
        default: '1'
      force:
        description: Open the PR even when only the recorded tag changed
        type: boolean
        default: false

permissions:
  contents: read

env:
  MAX_AI_BUDGET_USD: 1
  MODEL: gpt-6.1-sol
  REFIT_REPOSITORY: pierceluu10/Refit

concurrency:
  group: stripe-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check inputs
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref || 'main' }}
          AI_BUDGET: ${{ inputs.ai_budget || '1' }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+$ ]]; then echo "::error::tag must look like v2591"; exit 1; fi
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "::error::ref must be a branch name or commit SHA"; exit 1; fi
          if ! [[ "$AI_BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || ! awk -v b="$AI_BUDGET" -v m="$MAX_AI_BUDGET_USD" 'BEGIN { exit !(b >= 0 && b <= m) }'; then
            echo "::error::ai_budget must be a number from 0 to $MAX_AI_BUDGET_USD"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REFIT_REPOSITORY }}
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refit/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      - name: Choose the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          recorded=$(jq -r .source refit/pipeline/stripe-sdk-metadata.json | awk '{ print $2 }')
          if [ -n "$TAG" ]; then
            tag="$TAG"; mode=explicit
          else
            tag=$(gh api repos/stripe/openapi/releases/latest --jq .tag_name)
            mode=if-newer
          fi
          echo "Refit's SDK map: $recorded; candidate: $tag ($mode)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Generate the release files
        id: generate
        working-directory: refit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ steps.tag.outputs.mode }}
          AI_BUDGET: ${{ inputs.ai_budget || '1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          args=(--tag "$TAG" --body "$out/body.md" --summary "$out/summary.json")
          if [ "$MODE" = if-newer ]; then args+=(--if-newer); fi
          if awk -v b="$AI_BUDGET" 'BEGIN { exit !(b > 0) }' && [ -n "$OPENAI_API_KEY" ]; then
            # The key reaches Refit only through this file, removed right after the run.
            printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=%s\nREFIT_AI_BUDGET_USD=%s\nREFIT_AI_BUDGET_DIRECTORY=%s\n' \
              "$OPENAI_API_KEY" "$MODEL" "$AI_BUDGET" "$RUNNER_TEMP/ai-budget" > "$RUNNER_TEMP/ai.env"
            args+=(--env "$RUNNER_TEMP/ai.env")
          else
            args+=(--no-ai)
          fi
          unset OPENAI_API_KEY
          status=0
          node scripts/stripe-release-pr.mjs "${args[@]}" || status=$?
          rm -f "$RUNNER_TEMP/ai.env"
          if [ -d "$RUNNER_TEMP/ai-budget" ]; then cp -r "$RUNNER_TEMP/ai-budget" "$out/ai-budget"; fi
          if [ $status -ne 0 ]; then exit $status; fi
          echo "status=$(jq -r .status "$out/summary.json")" >> "$GITHUB_OUTPUT"
      - name: Build the branch
        if: steps.generate.outputs.status == 'changed' || steps.generate.outputs.status == 'unchanged'
        working-directory: refit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/out"
          base=$(git rev-parse HEAD)
          git switch -c "release/stripe-$TAG"
          git add -A
          git -c user.name='refit-bench' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q --allow-empty -m "chore(stripe): release $TAG"
          git diff --stat "$base" HEAD | tee "$out/diffstat.txt"
          git format-patch -1 --stdout HEAD > "$out/release.patch"
          git bundle create "$out/release.bundle" "$base..HEAD"
          echo "$base" > "$out/base.txt"
          {
            echo "# Stripe release $TAG ($(jq -r .status "$out/summary.json"))"
            echo
            cat "$out/body.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-release
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
      - name: Open the PR
        if: steps.generate.outputs.status == 'changed' || (steps.generate.outputs.status == 'unchanged' && inputs.force)
        working-directory: refit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REFIT_PR_TOKEN: ${{ secrets.REFIT_PR_TOKEN }}
        run: |
          if [ -z "$REFIT_PR_TOKEN" ]; then
            echo "::error::The REFIT_PR_TOKEN secret is not set. Add a fine-grained token limited to $REFIT_REPOSITORY with Contents: read and write and Pull requests: read and write as the refit-bench repository secret REFIT_PR_TOKEN. The generated branch is in the stripe-release artifact (release.patch, release.bundle)."
            exit 1
          fi
          branch="release/stripe-$TAG"
          export GH_TOKEN="$REFIT_PR_TOKEN"
          open=$(gh pr list -R "$REFIT_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url')
          if [ -n "$open" ]; then echo "::notice::$open is already open for $branch"; exit 0; fi
          git push "https://x-access-token:${REFIT_PR_TOKEN}@github.com/${REFIT_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create -R "$REFIT_REPOSITORY" --base main --head "$branch" \
            --title "chore(stripe): release $TAG" --body-file "$RUNNER_TEMP/out/body.md"
