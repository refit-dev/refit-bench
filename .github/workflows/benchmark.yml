name: Stripe benchmark

# Runs the Refit Stripe benchmark without AI on GitHub-hosted runners, one job per shard.
# Logs and artifacts of this public repository are public; never add secrets beyond the read token.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Refit commit SHA to benchmark
        required: true
        default: 502b8c0eaa52f828fe8f5de799606e78e2289821
      list:
        description: Frozen repository list under docs/benchmarks
        required: true
        default: 2026-10-16-stripe-fresh-repos.json
      offset:
        description: First repository of the first shard
        required: true
        default: '0'
      size:
        description: Repositories per shard
        required: true
        default: '1'
      count:
        description: Repositories to run from the offset (blank runs the rest of the list)
        required: false
        default: '5'
      ai:
        description: Run AI patches and repair (spends the OPENAI_API_KEY secret's budget)
        type: boolean
        default: false
      ai_budget:
        description: AI cap in USD for the whole run, split evenly across shards (at most 20)
        required: false
        default: '2'
      flags:
        description: Extra benchmark:stripe flags, such as --publish-unresolved (no --ai, no --env)
        required: false
        default: ''

permissions:
  contents: read

env:
  OASDIFF_VERSION: 1.33.0
  REFIT_DOCKER_IMAGE: node:22-alpine

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      end: ${{ steps.shards.outputs.end }}
      shard_budget: ${{ steps.shards.outputs.shard_budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          sparse-checkout: docs/benchmarks
          persist-credentials: false
      # One shard per `size` repositories; GitHub caps a matrix at 256 jobs.
      - name: Check flags
        env:
          FLAGS: ${{ inputs.flags }}
        run: |
          if ! [[ "$FLAGS" =~ ^[A-Za-z0-9\ ._=/,-]*$ ]] || [[ " $FLAGS " =~ \ --(ai|env|publish)[\ =] ]]; then
            echo "::error::flags may hold only plain options, and never --ai, --env or --publish"
            exit 1
          fi
      - id: shards
        env:
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
          COUNT: ${{ inputs.count }}
          AI: ${{ inputs.ai }}
          AI_BUDGET: ${{ inputs.ai_budget }}
        run: |
          total=$(jq '.repos | length' "docs/benchmarks/$LIST")
          count=$((total - OFFSET))
          if [ -n "$COUNT" ] && [ "$COUNT" -lt "$count" ]; then count=$COUNT; fi
          if [ "$count" -le 0 ]; then echo "::error::Offset $OFFSET is past the list's $total repositories"; exit 1; fi
          shards=$(((count + SIZE - 1) / SIZE))
          if [ "$shards" -gt 256 ]; then echo "::error::$shards shards exceed the 256-job matrix limit; raise size"; exit 1; fi
          echo "$count repositories in $shards shards"
          if [ "$AI" = true ]; then
            if ! [[ "$AI_BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || ! awk -v b="$AI_BUDGET" 'BEGIN { exit !(b > 0 && b <= 20) }'; then
              echo "::error::ai_budget must be a number above 0 and at most 20"; exit 1
            fi
            echo "shard_budget=$(awk -v b="$AI_BUDGET" -v n="$shards" 'BEGIN { printf "%.4f", b / n }')" >> "$GITHUB_OUTPUT"
            echo "AI cap: \$$AI_BUDGET for the run"
          fi
          echo "end=$((OFFSET + count))" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((shards - 1)) | jq -cs .)" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refit/package-lock.json
      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oasdiff
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      - run: docker pull -q "$REFIT_DOCKER_IMAGE"
      - name: Run benchmark
        working-directory: refit
        env:
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
          SHARD: ${{ matrix.shard }}
          END: ${{ needs.plan.outputs.end }}
          FLAGS: ${{ inputs.flags }}
          AI: ${{ inputs.ai }}
          SHARD_BUDGET: ${{ needs.plan.outputs.shard_budget }}
          OPENAI_API_KEY: ${{ inputs.ai && secrets.OPENAI_API_KEY || '' }}
        run: |
          ai=()
          if [ "$AI" = true ]; then
            if [ -z "$OPENAI_API_KEY" ]; then echo "::error::The OPENAI_API_KEY secret is not set"; exit 1; fi
            # Ledger per shard; the run's total is ai_budget.
            printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=gpt-5.6-luna\nREFIT_AI_BUDGET_USD=%s\nREFIT_AI_BUDGET_DIRECTORY=%s\n' \
              "$OPENAI_API_KEY" "$SHARD_BUDGET" "$RUNNER_TEMP/ai-budget" > "$RUNNER_TEMP/ai.env"
            unset OPENAI_API_KEY
            ai=(--ai --env "$RUNNER_TEMP/ai.env")
          fi
          start=$((OFFSET + SHARD * SIZE))
          limit=$((END - start < SIZE ? END - start : SIZE))
          node scripts/stripe-benchmark-setup.mjs --root "$RUNNER_TEMP/root" --list "docs/benchmarks/$LIST" --offset "$start" --limit "$limit"
          mkdir -p "$RUNNER_TEMP/out"
          npm run benchmark:stripe -- --root "$RUNNER_TEMP/root" --output "$RUNNER_TEMP/out/run" --validate "${ai[@]}" $FLAGS
          rm -f "$RUNNER_TEMP/ai.env"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shard results
        run: |
          mkdir merged
          jq -s add shards/shard-*/run/results.json > merged/results.json
          {
            echo "# Merged Stripe benchmark ($(jq length merged/results.json) repositories)"
            echo
            echo "| Repository | Outcome | Pull request | Reason |"
            echo "|---|---|---|---|"
            cat shards/shard-*/run/summary.md | grep -E '^\| [^ ]+/[^ ]+ \|' || true
          } > merged/summary.md
          echo "AI spend: \$$(jq '[.[] | (.workflow.aiCostUsd // 0) + (.ai.costUsd // 0)] | add // 0' merged/results.json)" >> merged/summary.md
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: merged
          path: merged
