name: SDK request proof

# Runs `refit ai-migrations --prove-table` at a pinned Refit commit: for each call shape in Refit's
# data/sdk-request-proofs.json, the smallest request on the newest release of the SDK major an
# upgrade moves to (openai 6.x, @anthropic-ai/sdk 1.x), with a stream, a forced tool call and JSON
# output where the shape has them, sent with Refit's own keys from repository secrets, never a
# customer's. A provider whose secret is missing stays pending with that reason. It never writes to
# Refit: a person copies the uploaded sdk-request-proofs.json into Refit's data/.
# Logs and artifacts of this public repository are public; the command prints only call names,
# releases, HTTP statuses and check names, redacts anything key-shaped, and secrets go only through
# repository secrets.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Refit commit SHA to run
        required: true

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check inputs
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::commit must be a full 40-character SHA"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      # The SDKs under test are installed apart from Refit's own dependencies, without scripts.
      - name: Install the target SDK majors
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          npm install --prefix "$RUNNER_TEMP/sdk" --no-save --no-audit --no-fund --ignore-scripts 'openai@6' '@anthropic-ai/sdk@1'
          node -e 'const v=(n)=>require(process.env.RUNNER_TEMP+"/sdk/node_modules/"+n+"/package.json").version; console.log(`openai@${v("openai")},@anthropic-ai/sdk@${v("@anthropic-ai/sdk")}`)' > "$RUNNER_TEMP/releases.txt"
          cat "$RUNNER_TEMP/releases.txt"
      - name: Send the proof requests
        working-directory: refit
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node bin/refit.mjs ai-migrations --prove-table \
            --sdk-directory "$RUNNER_TEMP/sdk" \
            --releases "$(cat "$RUNNER_TEMP/releases.txt")" \
            --run "$RUN_URL" \
            --output "$RUNNER_TEMP/sdk-request-proofs.json" | tee "$RUNNER_TEMP/summary.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo '## SDK request proof'
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo 'No summary.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-request-proofs
          path: ${{ runner.temp }}/sdk-request-proofs.json
          if-no-files-found: warn
