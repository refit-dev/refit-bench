name: Stripe benchmark

# Runs the Refit Stripe benchmark on GitHub-hosted runners, one job per shard; AI only with `ai: true`.
# Logs and artifacts of this public repository are public; secrets go only through repository secrets.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character Refit commit SHA to benchmark
        required: true
        default: 502b8c0eaa52f828fe8f5de799606e78e2289821
      list:
        description: Frozen repository list under docs/benchmarks
        required: true
        default: 2026-10-16-stripe-fresh-repos.json
      offset:
        description: First repository of the first shard
        required: true
        default: '0'
      size:
        description: Repositories per shard
        required: true
        default: '1'
      count:
        description: Repositories to run from the offset (blank runs the rest of the list)
        required: false
        default: '5'
      ai:
        description: Run AI patches and repair (spends the OPENAI_API_KEY secret's budget)
        type: boolean
        default: false
      ai_budget:
        description: AI cap in USD for the whole run, split evenly across shards (at most 1000, the most Refit accepts)
        required: false
        default: '2'
      model:
        description: OpenAI model for AI patches (priced in pipeline/ai-budget.ts)
        type: choice
        options: [gpt-6.1-sol, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
        default: gpt-6.1-sol
      flags:
        description: Extra benchmark:stripe flags, such as --publish-unresolved (no --ai, no --env)
        required: false
        default: ''

permissions:
  contents: read

env:
  OASDIFF_VERSION: 1.33.0
  REFIT_DOCKER_IMAGE: node:22-alpine
  STRIPE_MOCK_IMAGE: stripe/stripe-mock:latest

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      end: ${{ steps.shards.outputs.end }}
      shard_budget: ${{ steps.shards.outputs.shard_budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          sparse-checkout: docs/benchmarks
          persist-credentials: false
      # One shard per `size` repositories; GitHub caps a matrix at 256 jobs.
      - name: Check flags
        env:
          FLAGS: ${{ inputs.flags }}
        run: |
          if ! [[ "$FLAGS" =~ ^[A-Za-z0-9\ ._=/,-]*$ ]] || [[ " $FLAGS " =~ \ --(ai|env|publish)[\ =] ]]; then
            echo "::error::flags may hold only plain options, and never --ai, --env or --publish"
            exit 1
          fi
      - id: shards
        env:
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
          COUNT: ${{ inputs.count }}
          AI: ${{ inputs.ai }}
          AI_BUDGET: ${{ inputs.ai_budget }}
        run: |
          total=$(jq '.repos | length' "docs/benchmarks/$LIST")
          count=$((total - OFFSET))
          if [ -n "$COUNT" ] && [ "$COUNT" -lt "$count" ]; then count=$COUNT; fi
          if [ "$count" -le 0 ]; then echo "::error::Offset $OFFSET is past the list's $total repositories"; exit 1; fi
          shards=$(((count + SIZE - 1) / SIZE))
          if [ "$shards" -gt 256 ]; then echo "::error::$shards shards exceed the 256-job matrix limit; raise size"; exit 1; fi
          echo "$count repositories in $shards shards"
          if [ "$AI" = true ]; then
            if ! [[ "$AI_BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || ! awk -v b="$AI_BUDGET" 'BEGIN { exit !(b > 0 && b <= 1000) }'; then
              echo "::error::ai_budget must be a number above 0 and at most 1000"; exit 1
            fi
            echo "shard_budget=$(awk -v b="$AI_BUDGET" -v n="$shards" 'BEGIN { printf "%.4f", b / n }')" >> "$GITHUB_OUTPUT"
            echo "AI cap: \$$AI_BUDGET for the run"
          fi
          echo "end=$((OFFSET + count))" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((shards - 1)) | jq -cs .)" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refit/package-lock.json
      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oasdiff
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      # Refit never pulls images itself; generated checks need stripe-mock present locally.
      - run: |
          docker pull -q "$REFIT_DOCKER_IMAGE"
          docker pull -q "$STRIPE_MOCK_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$REFIT_DOCKER_IMAGE" "$STRIPE_MOCK_IMAGE" | tee "$RUNNER_TEMP/images.txt"
      - name: Run benchmark
        working-directory: refit
        env:
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
          SHARD: ${{ matrix.shard }}
          END: ${{ needs.plan.outputs.end }}
          FLAGS: ${{ inputs.flags }}
          AI: ${{ inputs.ai }}
          SHARD_BUDGET: ${{ needs.plan.outputs.shard_budget }}
          MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ inputs.ai && secrets.OPENAI_API_KEY || '' }}
          # The runner has 16 GB; Node's default heap ran out on SimplerDevelopment.
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          ai=()
          if [ "$AI" = true ]; then
            if [ -z "$OPENAI_API_KEY" ]; then echo "::error::The OPENAI_API_KEY secret is not set"; exit 1; fi
            # Ledger per shard; the run's total is ai_budget.
            printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=%s\nREFIT_AI_BUDGET_USD=%s\nREFIT_AI_BUDGET_DIRECTORY=%s\n' \
              "$OPENAI_API_KEY" "$MODEL" "$SHARD_BUDGET" "$RUNNER_TEMP/ai-budget" > "$RUNNER_TEMP/ai.env"
            unset OPENAI_API_KEY
            ai=(--ai --env "$RUNNER_TEMP/ai.env")
          fi
          start=$((OFFSET + SHARD * SIZE))
          limit=$((END - start < SIZE ? END - start : SIZE))
          # A repository that no longer clones (deleted or private) must not cost the shard its other
          # rows: setup still writes selected.json, and the benchmark records it as a clone failure.
          node scripts/stripe-benchmark-setup.mjs --root "$RUNNER_TEMP/root" --list "docs/benchmarks/$LIST" --offset "$start" --limit "$limit" \
            || echo "::warning::Setup could not clone every repository; the benchmark records each as a clone failure."
          mkdir -p "$RUNNER_TEMP/out"
          npm run benchmark:stripe -- --root "$RUNNER_TEMP/root" --output "$RUNNER_TEMP/out/run" --validate "${ai[@]}" $FLAGS
          rm -f "$RUNNER_TEMP/ai.env"
          cp "$RUNNER_TEMP/images.txt" "$RUNNER_TEMP/out/images.txt"
          # The AI ledger holds spend records only, never the key.
          if [ -d "$RUNNER_TEMP/ai-budget" ]; then cp -r "$RUNNER_TEMP/ai-budget" "$RUNNER_TEMP/out/ai-budget"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  merge:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pierceluu10/Refit
          ref: ${{ inputs.commit }}
          token: ${{ secrets.REFIT_READ_TOKEN }}
          path: refit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refit/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: refit
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shard results
        env:
          LIST: ${{ inputs.list }}
          OFFSET: ${{ inputs.offset }}
          END: ${{ needs.plan.outputs.end }}
          COMMIT: ${{ inputs.commit }}
        run: |
          mkdir merged
          shopt -s nullglob
          files=(shards/shard-*/run/results.json)
          if [ ${#files[@]} -gt 0 ]; then jq -s add "${files[@]}" > merged/results.json; else echo '[]' > merged/results.json; fi
          # Every repository the plan assigned must have exactly one row.
          jq -r --argjson offset "$OFFSET" --argjson end "$END" '.repos[$offset:$end][].repo' "refit/docs/benchmarks/$LIST" | sort > merged/expected.txt
          jq -r '.[].repo' merged/results.json | sort > merged/present.txt
          comm -23 merged/expected.txt <(sort -u merged/present.txt) > merged/missing.txt
          comm -13 merged/expected.txt <(sort -u merged/present.txt) > merged/unexpected.txt
          uniq -d merged/present.txt > merged/duplicated.txt
          cat shards/shard-*/images.txt 2>/dev/null | sort -u > merged/images.txt || true
          {
            echo "# Merged Stripe benchmark: $(jq length merged/results.json) of $(wc -l < merged/expected.txt) repositories"
            echo
            echo "Commit \`$COMMIT\`, list \`$LIST\`, repositories $OFFSET to $END. Images: $(paste -sd ' ' merged/images.txt)"
            echo
            if [ -s merged/missing.txt ] || [ -s merged/unexpected.txt ] || [ -s merged/duplicated.txt ]; then
              echo "**Incomplete run.** Missing $(wc -l < merged/missing.txt), unexpected $(wc -l < merged/unexpected.txt), duplicated $(wc -l < merged/duplicated.txt). Missing: $(paste -sd ' ' merged/missing.txt)"
              echo
            fi
            echo "| Outcome class | Repositories |"
            echo "|---|---|"
            jq -r 'group_by(.outcomeClass // "unclassified")[] | "| \(.[0].outcomeClass // "unclassified") | \(length) |"' merged/results.json
            echo
            # The summary the benchmark itself writes, over every shard's rows.
            (cd refit && npx tsx -e "import { readFileSync } from 'node:fs'; import { summaryTable } from './pipeline/stripe-benchmark.ts'; console.log(summaryTable(JSON.parse(readFileSync('../merged/results.json', 'utf8'))))")
          } > merged/summary.md
          echo "AI spend: \$$(jq '[.[] | (.workflow.aiCostUsd // 0) + (.ai.costUsd // 0)] | add // 0' merged/results.json)" >> merged/summary.md
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged
          path: merged
      - name: Fail on missing or duplicated repositories
        run: |
          if [ -s merged/missing.txt ] || [ -s merged/unexpected.txt ] || [ -s merged/duplicated.txt ]; then
            echo "::error::Missing $(wc -l < merged/missing.txt), unexpected $(wc -l < merged/unexpected.txt), duplicated $(wc -l < merged/duplicated.txt) repositories; see merged/missing.txt"
            exit 1
          fi
